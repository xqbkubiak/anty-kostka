plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
    id 'maven-publish'
}

group = 'pl.bkubiak'
version = '1.0'

subprojects {
    apply plugin: 'java'
    
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        mavenCentral()
    }
}

// Common module configuration handled by source sets in subprojects

// Configure all version modules
configure(subprojects.findAll { it.name.startsWith('v1.') }) {
    apply plugin: 'fabric-loom'

    // Centralized version definitions using gradle.properties
    def mcVersionMap = [
        'v1.21.1' : [mc: project.property('ver_1_21_1_minecraft'), mappings: project.property('ver_1_21_1_yarn'), loader: project.property('loader_version'),  fabricApi: project.property('ver_1_21_1_fabric')],
        'v1.21.3' : [mc: project.property('ver_1_21_3_minecraft'), mappings: project.property('ver_1_21_3_yarn'), loader: project.property('loader_version'),  fabricApi: project.property('ver_1_21_3_fabric')],
        'v1.21.4' : [mc: project.property('ver_1_21_4_minecraft'), mappings: project.property('ver_1_21_4_yarn'), loader: project.property('loader_version'),  fabricApi: project.property('ver_1_21_4_fabric')],
        'v1.21.5' : [mc: project.property('ver_1_21_5_minecraft'), mappings: project.property('ver_1_21_5_yarn'), loader: project.property('loader_version'),  fabricApi: project.property('ver_1_21_5_fabric')],
        'v1.21.6' : [mc: project.property('ver_1_21_6_minecraft'), mappings: project.property('ver_1_21_6_yarn'), loader: project.property('loader_version'),  fabricApi: project.property('ver_1_21_6_fabric')],
        'v1.21.8' : [mc: '1.21.8', mappings: '1.21.8+build.1', loader: '0.18.3', fabricApi: '0.136.1+1.21.8'],
        'v1.21.10': [mc: '1.21.10', mappings: '1.21.10+build.3', loader: '0.18.3', fabricApi: '0.138.4+1.21.10']
    ]

    def cfg = mcVersionMap[project.name]

    sourceSets {
        main {
            java {
                srcDirs += [rootProject.file('common/src/main/java')]
            }
            resources {
                srcDirs += [rootProject.file('common/src/main/resources')]
            }
        }
    }

    dependencies {
        if (cfg != null) {
            minecraft "com.mojang:minecraft:${cfg.mc}"
            mappings "net.fabricmc:yarn:${cfg.mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${cfg.loader}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${cfg.fabricApi}"
        }

        implementation 'com.google.code.gson:gson:2.10.1'
    }

    processResources {
        inputs.property "version", rootProject.version
        
        filesMatching("fabric.mod.json") {
            expand "version": rootProject.version
        }
    }

    jar {
        archiveBaseName = "BK-Inventory"
        archiveVersion = "${project.name.replace('v', '')}"
    }

    tasks.named('remapJar') {
        archiveBaseName = "BK-Inventory"
        archiveVersion = "${project.name.replace('v', '')}"
    }

    java {
        withSourcesJar()
    }
}

// Task to build all versions at once
task buildAll {
    dependsOn subprojects.findAll { it.name.startsWith('v1.') }.collect { ":${it.name}:build" }
    description = 'Build all version modules'
    group = 'build'
}